name: rag-eval

on:
  schedule:
    # 03:30 UTC daily
    - cron: "30 3 * * *"
  workflow_dispatch:

# Nightly grading of the RAG copilot against the eval set in
# rag/eval/evaluate.py. Requires two things that live outside the repo:
#   - OPENAI_API_KEY (Actions secret)  -> otherwise the job skips cleanly
#   - indexed policy/regulatory documents (rag_documents table)
# Without either, answer_question degrades (no sources -> all questions fail),
# so the job deliberately SKIPS rather than burning API calls on an empty index.
jobs:
  rag-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rag
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RAG app
        working-directory: rag
        run: pip install -e ".[dev]"
      - name: Apply schema migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done
      - name: Gate on configured infra
        id: infra
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY not configured; skipping eval"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run eval
        working-directory: rag
        if: steps.infra.outputs.skip != 'true'
        run: python eval/evaluate.py --min-pass-rate 60