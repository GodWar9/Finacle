name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stack-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build containers and verify ledger, restart and Kafka recovery
        run: python scripts/stack_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finacle-stack-acceptance
          path: test-results/stack/
          retention-days: 7

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finacle-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  gateway-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: finacle_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d finacle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:55432/finacle_test
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Generate gateway gRPC stubs
        run: python -m grpc_tools.protoc --proto_path=../core/proto --python_out=. --grpc_python_out=. --pyi_out=. ../core/proto/ledger.proto
      - run: pytest -v

  rust-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # SQL queries stay compile-time checked against the checked-in offline
      # cache (SQLX_OFFLINE), while the DB-backed #[sqlx::test] suites run
      # against the Postgres service at test runtime.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --check
        working-directory: core
      - run: cargo clippy -- -D warnings
        working-directory: core
      - run: cargo test
        working-directory: core

  rag-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: finacle_rag_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d finacle_rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:55432/finacle_rag_test
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v

  recon-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpqxx-dev libgtest-dev
      - name: Build
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_OPENMP=ON && cmake --build build
        working-directory: recon
      - name: Test
        run: ./build/recon_tests
        working-directory: recon

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check gateway/ rag/ scripts/stack_smoke.py
      - run: ruff format --check gateway/ rag/ scripts/stack_smoke.py
