name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust Tests (Ledger Core)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger_app
          POSTGRES_PASSWORD: dev_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger_app -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.7.4 --no-default-features --features postgres
      
      - name: Run migrations
        run: |
          cd core
          sqlx database create --database-url postgresql://ledger_app:dev_only@localhost:5432/ledger
          sqlx migrate run --database-url postgresql://ledger_app:dev_only@localhost:5432/ledger --source ../db/migrations
      
      - name: Check formatting
        run: cargo fmt --check --manifest-path core/Cargo.toml
      
      - name: Run clippy
        run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings
        env:
          DATABASE_URL: postgresql://ledger_app:dev_only@localhost:5432/ledger

      - name: Run tests
        run: cargo test --manifest-path core/Cargo.toml
        env:
          DATABASE_URL: postgresql://ledger_app:dev_only@localhost:5432/ledger

      - name: Prepare sqlx offline data
        run: |
          cd core
          cargo sqlx prepare --database-url postgresql://ledger_app:dev_only@localhost:5432/ledger -- --all-targets
        env:
          DATABASE_URL: postgresql://ledger_app:dev_only@localhost:5432/ledger

      - name: Upload sqlx offline data
        uses: actions/upload-artifact@v4
        with:
          name: sqlx-offline
          path: core/.sqlx/
          retention-days: 7

  cpp-tests:
    name: C++ Tests (Reconciliation Engine)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger_app
          POSTGRES_PASSWORD: dev_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger_app -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libpqxx-dev libgtest-dev build-essential
          cd /usr/src/gtest && sudo cmake . && sudo make && sudo cp lib/*.a /usr/lib
      
      - name: Build and test
        run: |
          cd recon
          cmake -B build -DBUILD_TESTS=ON -DENABLE_OPENMP=ON
          cmake --build build -- -j$(nproc)
          ./build/recon_tests

  python-gateway-tests:
    name: Python Tests (Gateway)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger_app
          POSTGRES_PASSWORD: dev_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger_app -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          cd gateway
          pip install -e ".[dev]"
      
      - name: Generate gRPC stubs
        run: |
          cd gateway
          python -m grpc_tools.protoc \
            --proto_path=../core/proto \
            --python_out=. \
            --grpc_python_out=. \
            --pyi_out=. \
            ../core/proto/ledger.proto

      - name: Run tests
        run: |
          cd gateway
          pytest -v --tb=short

  python-rag-tests:
    name: Python Tests (RAG Copilot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger_app
          POSTGRES_PASSWORD: dev_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger_app -d ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          cd rag
          pip install -e ".[dev]"
      
      - name: Run tests
        run: |
          cd rag
          pytest -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust-tests, cpp-tests, python-gateway-tests, python-rag-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download sqlx offline data
        uses: actions/download-artifact@v4
        with:
          name: sqlx-offline
          path: core/.sqlx

      - name: Build all images
        run: |
          docker compose build
      
      - name: Test images start
        run: |
          docker compose up -d
          sleep 10
          curl -f http://localhost:8000/health
          curl -f http://localhost:8001/health
          docker compose down