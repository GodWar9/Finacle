<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEDGER-CORE — Ops Console</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="app-shell">

    <header class="topbar">
      <div class="topbar__wordmark">LEDGER<span>-CORE</span> · Ops Console</div>
      <div class="topbar__status">
        <span><span class="status-dot"></span>core</span>
        <span><span class="status-dot"></span>gateway</span>
        <span><span class="status-dot"></span>recon</span>
        <span><span class="status-dot"></span>rag</span>
      </div>
    </header>

    <nav class="side-nav">
      <button class="side-nav__item side-nav__item--active" data-view="overview">
        <span class="side-nav__index">01</span> Overview
      </button>
      <button class="side-nav__item" data-view="transactions">
        <span class="side-nav__index">02</span> Transactions
      </button>
      <button class="side-nav__item" data-view="reconciliation">
        <span class="side-nav__index">03</span> Reconciliation
      </button>
      <button class="side-nav__item" data-view="copilot">
        <span class="side-nav__index">04</span> Copilot
      </button>
    </nav>

    <main class="main-content">
      <div class="view view--active" id="view-overview"></div>
      <div class="view" id="view-transactions"></div>
      <div class="view" id="view-reconciliation"></div>
      <div class="view" id="view-copilot"></div>
    </main>

  </div>

  <!-- Mock data first, since api.js references it directly (no bundler,
       so load order matters — this is plain script tags, on purpose,
       per the "no frameworks / no CDN" preference). -->
  <script src="data/mock-data.js"></script>

  <!-- Shared helpers -->
  <script src="js/format.js"></script>
  <script src="js/api.js"></script>

  <!-- One file per view, each owning its own <div id="view-..."> -->
  <script src="js/render-overview.js"></script>
  <script src="js/render-transactions.js"></script>
  <script src="js/render-reconciliation.js"></script>
  <script src="js/render-copilot.js"></script>

  <!-- Wires the nav to the views. Loads last since it calls the objects above. -->
  <script src="js/main.js"></script>

</body>
</html>
