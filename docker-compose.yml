services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_app
      POSTGRES_PASSWORD: dev_only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_app -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  ledger-core:
    build:
      context: .
      dockerfile: core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports: ["50051:50051"]
    environment:
      DATABASE_URL: postgresql://ledger_app:dev_only@postgres:5432/ledger
      KAFKA_BROKERS: kafka:9092
      RUST_LOG: info

  recon-engine:
    build: ./recon
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["batch"]
    environment:
      DATABASE_URL: postgresql://ledger_app:dev_only@postgres:5432/ledger

  settlement-processor:
    build:
      context: .
      dockerfile: settlement-processor/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      ledger-core:
        condition: service_started
    profiles: ["batch"]
    environment:
      DATABASE_URL: postgresql://ledger_app:dev_only@postgres:5432/ledger
      KAFKA_BROKERS: kafka:9092
      RECON_ENGINE_PATH: /app/recon_engine
      POLL_INTERVAL: "10"
      RUST_LOG: info

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ledger-core:
        condition: service_started
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://ledger_app:dev_only@postgres:5432/ledger
      REDIS_URL: redis://redis:6379
      LEDGER_CORE_ADDR: ledger-core:50051
      RUST_LOG: info

  rag-copilot:
    build: ./rag
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports: ["8001:8001"]
    environment:
      DATABASE_URL: postgresql://ledger_app:dev_only@postgres:5432/ledger
      KAFKA_BROKERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: text-embedding-3-small

  rag-indexer:
    build: ./rag
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ledger_app:dev_only@postgres:5432/ledger
      KAFKA_BROKERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: text-embedding-3-small
    command: ["python", "-m", "indexer.kafka_consumer"]

  prometheus:
    image: prom/prometheus:v2.51.0
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.0
    ports: ["3000:3000"]
    depends_on: [prometheus]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana_dashboard.json:/var/lib/grafana/dashboards/finacle.json:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin