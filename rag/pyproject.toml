[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-copilot"
version = "0.1.0"
description = "RAG Compliance & Reconciliation Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    "redis>=5.0",
    "httpx>=0.26",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "openai>=1.12",
    "tiktoken>=0.5",
    "aiokafka>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "fakeredis>=2.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "indexer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]