[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway"
version = "0.1.0"
description = "API Gateway with Idempotency Middleware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "redis>=5.0",
    "asyncpg>=0.29",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "httpx>=0.26",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "prometheus-client>=0.19",
    "python-multipart>=0.0.6",
    "aiokafka>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "fakeredis>=2.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]