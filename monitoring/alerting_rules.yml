groups:
- name: ledger-core
  interval: 30s
  rules:
  - alert: HighTransactionLatency
    expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{service="gateway"}[5m])) > 1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High transaction latency (p99 > 1s)"
      description: "Transaction latency p99 is {{ $value }}s"

  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "High error rate"
      description: "Error rate is {{ $value }}"

  - alert: IdempotencyConflictRate
    expr: rate(idempotency_conflicts_total[5m]) > 0.01
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "High idempotency conflict rate"
      description: "Idempotency conflict rate is {{ $value }}"

  - alert: RateLimitExceeded
    expr: rate(rate_limit_exceeded_total[5m]) > 0.1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Rate limit exceeded frequently"
      description: "Rate limit exceeded rate is {{ $value }}"

  - alert: ReconciliationExceptionsHigh
    expr: rate(reconciliation_exceptions_total[1h]) > 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High reconciliation exception rate"
      description: "Reconciliation exception rate is {{ $value }}/hour"

  - alert: BalanceAuditMismatch
    expr: balance_audit_mismatches_total > 0
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: "Balance audit found mismatches"
      description: "Balance audit found {{ $value }} account mismatches"

  - alert: CircuitBreakerOpen
    expr: circuit_breaker_state == 1
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: "Circuit breaker is open"
      description: "Circuit breaker for {{ $labels.service }} is open"

  - alert: KafkaLagHigh
    expr: kafka_consumer_lag > 10000
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Kafka consumer lag is high"
      description: "Consumer lag is {{ $value }} messages"

  - alert: DatabaseConnectionsHigh
    expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Database connections near limit"
      description: "Database connections at {{ $value | humanizePercentage }} of max"